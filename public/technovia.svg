<svg xmlns="http://w3.org" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Perfectly reconstructed Technovia vibrant multi-stop linear gradient -->
    <linearGradient id="technovia-true-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a3cd6"/>
      <stop offset="30%" stop-color="#551ab7"/>
      <stop offset="55%" stop-color="#d61a6c"/>
      <stop offset="80%" stop-color="#ff4511"/>
      <stop offset="100%" stop-color="#ff8719"/>
    </linearGradient>
  </defs>

  <!-- Perfect White Circular Background Container -->
  <circle cx="256" cy="256" r="246" fill="#FFFFFF"/>

  <!-- Master Logo Group aligned precisely to center -->
  <g transform="translate(0, 5)">
    <!-- Outer Orbiting Technology Arc -->
    <path d="M 94,272 A 162,162 0 0,1 418,272" fill="none" stroke="url(#technovia-true-grad)" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Outer Arc Left Terminal Node -->
    <circle cx="94" cy="272" r="11" fill="white" stroke="url(#technovia-true-grad)" stroke-width="9"/>
    
    <!-- Outer Arc Right Terminal Node -->
    <circle cx="418" cy="272" r="11" fill="white" stroke="url(#technovia-true-grad)" stroke-width="9"/>

    <!-- Display / Monitor Frame Grid -->
    <rect x="168" y="196" width="176" height="114" rx="14" fill="white" stroke="url(#technovia-true-grad)" stroke-width="13" stroke-linejoin="round"/>
    
    <!-- Monitor Stand Base & Column Architecture -->
    <path d="M 256,310 L 256,334" stroke="url(#technovia-true-grad)" stroke-width="15" stroke-linecap="square"/>
    <path d="M 198,348 C 220,339 292,339 314,348" fill="none" stroke="url(#technovia-true-grad)" stroke-width="13" stroke-linecap="round"/>

    <!-- Internal Circuit Patterns (Positioned Precisely) -->
    <!-- Far Left Circuit Trace to Top Node -->
    <path d="M 188,296 L 244,232 L 244,222" fill="none" stroke="url(#technovia-true-grad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="244" cy="216" r="6" fill="white" stroke="url(#technovia-true-grad)" stroke-width="7"/>

    <!-- Lower Middle Anchor Node -->
    <circle cx="230" cy="281" r="5" fill="url(#technovia-true-grad)"/>

    <!-- Center Diagonal Circuit Trace to High Center Node -->
    <path d="M 230,281 L 278,222 L 278,210" fill="none" stroke="url(#technovia-true-grad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="278" cy="204" r="6" fill="white" stroke="url(#technovia-true-grad)" stroke-width="7"/>

    <!-- Right Horizontal Circuit Trace to Lateral Node -->
    <path d="M 240,281 L 302,281 L 318,258" fill="none" stroke="url(#technovia-true-grad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="321" cy="251" r="6" fill="white" stroke="url(#technovia-true-grad)" stroke-width="7"/>
  </g>
</svg>
